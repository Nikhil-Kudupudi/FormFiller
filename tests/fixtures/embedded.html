<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fieldwise fixture — embedded ATS</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 46rem; margin: 2rem auto; padding: 0 1rem; }
  iframe { width: 100%; height: 30rem; border: 1px solid #ccc; border-radius: 6px; }
</style>
</head>
<body>
<!--
  A job board that embeds its ATS. The outer page carries the posting but no
  form at all, so an extension that messages the top frame finds nothing to
  fill and reports the page as unreadable. The fields live entirely in the
  iframe, on a different origin.
-->
<h1>Software Engineer</h1>
<p>Apply below.</p>
<iframe id="ats" src="https://jobs.lever.co/acme/engineer/apply" title="Application"></iframe>
</body>
</html>
